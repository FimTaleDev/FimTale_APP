[versions]
agp = "8.13.2"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.1"
material = "1.12.0"
# Keep the Java/View-compatible releases; newer Iconics releases add Compose dependencies.
iconics = "5.4.0"
communityMaterial = "7.0.96.0-kotlin"
jparsec = "3.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
iconics-core = { group = "com.mikepenz", name = "iconics-core", version.ref = "iconics" }
iconics-community-material = { group = "com.mikepenz", name = "community-material-typeface", version.ref = "communityMaterial" }
jparsec = { group = "org.jparsec", name = "jparsec", version.ref = "jparsec" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
