plugins {
    alias(libs.plugins.android.application)
}

def siteUrl = providers.gradleProperty('fimtaleSiteUrl').getOrElse('https://fimtale.dev')
def apiUrl = providers.gradleProperty('fimtaleApiUrl').getOrElse('https://api.fimtale.dev/api/')
[siteUrl, apiUrl].each { value ->
    def uri = new URI(value)
    if (uri.scheme != 'https' || !uri.host || uri.userInfo || uri.query || uri.fragment) {
        throw new GradleException('FimTale URLs must be absolute HTTPS URLs without credentials, queries or fragments')
    }
}

android {
    buildFeatures { buildConfig true }

    namespace 'com.fimtale'
    compileSdk 34

    defaultConfig {
        applicationId "com.fimtale"
        minSdk 31
        targetSdk 34
        versionCode 7
        versionName "0.6.0"

        buildConfigField 'String', 'SITE_URL', groovy.json.JsonOutput.toJson(siteUrl.replaceAll('/+$', ''))
        buildConfigField 'String', 'API_URL', groovy.json.JsonOutput.toJson(apiUrl.replaceAll('/+$', '') + '/')
        // Public widget keys from ft-front's runtime config; override for another deployment.
        buildConfigField 'String', 'TURNSTILE_SITE_KEY', groovy.json.JsonOutput.toJson(providers.gradleProperty('fimtaleTurnstileSiteKey').getOrElse('0x4AAAAAACmSAXnazxHVfJuk'))
        buildConfigField 'String', 'HCAPTCHA_SITE_KEY', groovy.json.JsonOutput.toJson(providers.gradleProperty('fimtaleHCaptchaSiteKey').getOrElse('73382eae-4fea-41a8-8352-431ad5dc98f4'))
        buildConfigField 'String', 'TENCENT_CAPTCHA_APP_ID', groovy.json.JsonOutput.toJson(providers.gradleProperty('fimtaleTencentCaptchaAppId').getOrElse('189973578'))

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }

}

